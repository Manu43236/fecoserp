server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html so browsers always get the latest JS bundle references
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Vite assets have content-hash filenames — cache them aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
