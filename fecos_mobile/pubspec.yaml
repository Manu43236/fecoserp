name: fecos_mobile
description: FECOS ERP — Field Engineering Chemical Operations Solution
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation + DI
  get: ^4.6.6

  # Networking
  dio: ^5.7.0

  # Local database (offline-first)
  drift: ^2.22.1
  drift_flutter: ^0.2.4

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.2.4

  # Location
  geolocator: ^13.0.2

  # Camera / photo capture
  image_picker: ^1.1.2

  # Signature pad
  signature: ^5.5.0

  # Connectivity (offline indicator)
  connectivity_plus: ^6.1.3

  # Permissions
  permission_handler: ^11.3.1

  # Path provider (DB file path)
  path_provider: ^2.1.4

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/fecos_icon_bg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/icons/fecos_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
