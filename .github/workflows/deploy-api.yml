name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fecos-api/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 1992 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy API on EC2
        run: |
          ssh -p 1992 ubuntu@${{ secrets.EC2_HOST }} '
            set -e
            cd /app/fecos
            rm -f .git/index.lock .git/FETCH_HEAD.lock
            git fetch origin main
            rm -f .git/index.lock
            git reset --hard FETCH_HEAD
            docker compose -f docker-compose.prod.yml --env-file .env up --build -d api
            docker image prune -f
          '
