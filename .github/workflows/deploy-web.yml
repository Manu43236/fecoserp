name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'fecos-web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Web on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /app/fecos
            rm -f .git/index.lock .git/FETCH_HEAD.lock
            git fetch origin main
            rm -f .git/index.lock
            git reset --hard FETCH_HEAD
            docker compose -f docker-compose.prod.yml --env-file .env up --build -d web
            docker image prune -f
